services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: attest
      POSTGRES_PASSWORD: attest
      POSTGRES_DB: attest
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attest -d attest"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: ["/app/api"]
    environment:
      DATABASE_URL: postgres://attest:attest@postgres:5432/attest?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: docker-dev-attest-secret-change-me
      CORS_ORIGINS: http://localhost:3000
      SEED_DEMO: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://attest:attest@postgres:5432/attest?sslmode=disable
      WORKER_POLL_INTERVAL: 1s
      WORKER_LEASE_SECONDS: 30
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
